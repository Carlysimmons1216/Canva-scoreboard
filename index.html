<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Video Player</title>
  <style>
    body {
      margin: 0;
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    video {
      max-width: 100%;
      height: auto;
      border: 4px solid #fff;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <video controls autoplay>
    <source src="Blue%20Yellow%20Colorful%20Pixel%20Vibrant%20Video%20Gaming%20Mobile%20Video%20(1).mp4" type="video/mp4" />
    Your browser does not support the video tag.
  </video>
</body>
</html>
